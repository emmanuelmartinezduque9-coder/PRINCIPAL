# Cada cambio que llega a GitHub se comprueba: tipos y pruebas automáticas.
# La publicación la hace Railway por su cuenta al ver el cambio en `main`.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probar:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Las pruebas de vídeo usan ffmpeg/ffprobe reales.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint

  imagen:
    # La misma imagen que publica Railway (Dockerfile): que se construye y que el montador funciona dentro
    # (Python, librosa, rótulos 06B con freetype/harfbuzz, rea-video, yt-dlp y ffmpeg), con un montaje de verdad
    # y la separación de la voz del doblaje (BandIt v2).
    name: Imagen de Railway y montador
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t principal .
      - run: docker run --rm principal sh -c 'ffmpeg -version | head -1 && /opt/montador/bin/yt-dlp --version && /opt/montador/bin/python -m rea_video --help | head -3 && ls -la /opt/rea-models'
      - run: docker run --rm -v "$PWD/montador:/m" -w /m principal /opt/montador/bin/python -I -B test_montar_auto.py
      - run: docker run --rm -v "$PWD/montador:/m" -w /m principal /opt/montador/bin/python -I -B test_texto06b.py
      - run: docker run --rm -v "$PWD/montador:/m" -w /m principal /opt/montador/bin/python -I -B test_doblar.py
