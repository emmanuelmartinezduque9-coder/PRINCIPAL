# Cada cambio que llega a GitHub se comprueba: tipos y pruebas automáticas.
# La publicación la hace Railway por su cuenta al ver el cambio en `main`.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probar:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Las pruebas de vídeo usan ffmpeg/ffprobe reales.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
